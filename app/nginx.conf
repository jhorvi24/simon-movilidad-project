# Config de nginx endurecida para correr como usuario NO-root dentro del
# contenedor. Escucha en 8080 (puerto no privilegiado, >1024) para no requerir
# capacidades de root. Los paths de temporales se redirigen a /tmp para poder
# montar el root filesystem como solo lectura.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Directorios temporales en /tmp (escribibles aun con root FS de solo lectura)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    sendfile    on;
    keepalive_timeout 65;

    # Ocultar version de nginx (menos superficie de informacion)
    server_tokens off;

    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Endpoint de health check para el ALB. Responde 200 sin loguear ruido.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cabeceras de seguridad basicas
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer-when-downgrade;
    }
}
