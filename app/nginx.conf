# Config de nginx para la imagen unprivileged (usuario no-root, uid 101).
# Escucha en 8080 (puerto no privilegiado). El contenedor corre como no-root;
# el rootfs NO es de solo lectura, asi que nginx usa sus rutas por defecto
# para temporales y pid sin necesidad de volumenes montados.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    server {
        listen       8080;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer-when-downgrade;
    }
}
