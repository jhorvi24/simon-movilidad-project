# Config de nginx para la imagen unprivileged (usuario no-root, uid 101).
# Escucha en 8080. Los temporales y el pid van bajo /tmp, que en ECS Fargate
# se monta como volumen efimero escribible (ver mountPoints en la task def).
#
# Importante: NO definimos *_temp_path personalizados hacia subdirectorios de
# /tmp. Dejamos que nginx use sus rutas por defecto (compiladas en la imagen
# unprivileged bajo /tmp), evitando el mkdir() sobre el punto de montaje que
# falla por permisos cuando el tmpfs se monta vacio y como root.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rutas de temporales bajo /tmp (coinciden con los defaults de la imagen
    # unprivileged; el tmpfs montado en /tmp es escribible por el uid 101).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    access_log /dev/stdout;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    server {
        listen       8080;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer-when-downgrade;
    }
}
