<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="900" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Simón Movilidad — Pipeline CI/CD + Arquitectura AWS (multi-AZ)</text>

  <!-- ===================== CI/CD band ===================== -->
  <rect x="30" y="55" width="1120" height="180" rx="8" fill="#f5f5f5" stroke="#999999"/>
  <text x="45" y="75" font-size="13" font-weight="bold" fill="#666666">CI/CD</text>

  <!-- Dev -->
  <circle cx="90" cy="150" r="26" fill="#232F3E"/>
  <text x="90" y="155" text-anchor="middle" font-size="11" fill="#ffffff">Dev</text>
  <text x="90" y="192" text-anchor="middle" font-size="11" fill="#333">git push / PR / tag</text>

  <!-- Repo -->
  <rect x="160" y="120" width="150" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="235" y="145" text-anchor="middle" font-size="12" font-weight="bold">GitHub Repo</text>
  <text x="235" y="163" text-anchor="middle" font-size="10">modulos · env · app</text>

  <!-- Job security -->
  <rect x="340" y="100" width="170" height="110" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="425" y="122" text-anchor="middle" font-size="12" font-weight="bold">JOB 1 · security</text>
  <text x="425" y="144" text-anchor="middle" font-size="10">gitleaks (secretos)</text>
  <text x="425" y="160" text-anchor="middle" font-size="10">tflint (lint)</text>
  <text x="425" y="176" text-anchor="middle" font-size="10">checkov (misconfig)</text>
  <text x="425" y="192" text-anchor="middle" font-size="10">terraform fmt/validate</text>

  <!-- Job dev -->
  <rect x="540" y="100" width="185" height="110" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="632" y="122" text-anchor="middle" font-size="12" font-weight="bold">JOB 2 · deploy-dev</text>
  <text x="632" y="140" text-anchor="middle" font-size="10">(automático)</text>
  <text x="632" y="160" text-anchor="middle" font-size="10">OIDC AssumeRole</text>
  <text x="632" y="176" text-anchor="middle" font-size="10">build + push ECR</text>
  <text x="632" y="192" text-anchor="middle" font-size="10">terraform apply (dev)</text>

  <!-- Gate -->
  <polygon points="795,105 855,155 795,205 735,155" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="795" y="150" text-anchor="middle" font-size="9">Aprobación</text>
  <text x="795" y="163" text-anchor="middle" font-size="9">manual (prod)</text>

  <!-- Job prod -->
  <rect x="875" y="100" width="185" height="110" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="967" y="122" text-anchor="middle" font-size="12" font-weight="bold">JOB 3 · deploy-prod</text>
  <text x="967" y="142" text-anchor="middle" font-size="10">OIDC AssumeRole</text>
  <text x="967" y="160" text-anchor="middle" font-size="10">build + push ECR</text>
  <text x="967" y="178" text-anchor="middle" font-size="10">terraform apply (prod)</text>

  <!-- OIDC -->
  <rect x="1075" y="125" width="60" height="60" rx="6" fill="#DD344C"/>
  <text x="1105" y="152" text-anchor="middle" font-size="9" fill="#fff">OIDC</text>
  <text x="1105" y="166" text-anchor="middle" font-size="8" fill="#fff">STS</text>

  <!-- arrows cicd -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="116" y1="150" x2="158" y2="150"/>
    <line x1="310" y1="150" x2="338" y2="150"/>
    <line x1="510" y1="155" x2="538" y2="155"/>
    <line x1="725" y1="155" x2="735" y2="155"/>
    <line x1="855" y1="155" x2="873" y2="155"/>
  </g>
  <g stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrg)">
    <line x1="725" y1="185" x2="1073" y2="175"/>
  </g>

  <!-- ===================== AWS ===================== -->
  <rect x="30" y="255" width="1120" height="615" rx="8" fill="none" stroke="#ED7100" stroke-dasharray="6 4"/>
  <text x="45" y="275" font-size="13" font-weight="bold" fill="#ED7100">AWS · us-east-1 (misma plantilla para DEV y PROD)</text>

  <!-- bootstrap -->
  <rect x="50" y="290" width="360" height="90" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="60" y="308" font-size="11" font-weight="bold" fill="#333">bootstrap (1 vez por cuenta)</text>
  <rect x="70" y="318" width="150" height="50" rx="4" fill="#7AA116"/>
  <text x="145" y="338" text-anchor="middle" font-size="10" fill="#fff">S3 tfstate</text>
  <text x="145" y="353" text-anchor="middle" font-size="8" fill="#fff">versioning·KMS·lock</text>
  <rect x="240" y="318" width="150" height="50" rx="4" fill="#DD344C"/>
  <text x="315" y="338" text-anchor="middle" font-size="10" fill="#fff">Roles OIDC deploy</text>
  <text x="315" y="353" text-anchor="middle" font-size="8" fill="#fff">mín. privilegio</text>

  <!-- ECR / CW -->
  <rect x="440" y="300" width="120" height="55" rx="4" fill="#ED7100"/>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#fff">ECR</text>
  <text x="500" y="338" text-anchor="middle" font-size="9" fill="#fff">scan on push</text>
  <rect x="585" y="300" width="150" height="55" rx="4" fill="#E7157B"/>
  <text x="660" y="320" text-anchor="middle" font-size="10" fill="#fff">CloudWatch</text>
  <text x="660" y="336" text-anchor="middle" font-size="8" fill="#fff">Logs·Insights·FlowLogs</text>

  <!-- IGW / user -->
  <rect x="930" y="300" width="110" height="55" rx="4" fill="#8C4FFF"/>
  <text x="985" y="325" text-anchor="middle" font-size="10" fill="#fff">Internet GW</text>
  <circle cx="1095" cy="327" r="24" fill="#232F3E"/>
  <text x="1095" y="331" text-anchor="middle" font-size="9" fill="#fff">Usuario</text>
  <line x1="1071" y1="327" x2="1042" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1050" y="318" font-size="9" fill="#333">HTTP :80</text>

  <!-- VPC -->
  <rect x="50" y="395" width="1080" height="455" rx="6" fill="none" stroke="#248814"/>
  <text x="60" y="414" font-size="12" font-weight="bold" fill="#248814">VPC (dev 10.10.0.0/16 · prod 10.20.0.0/16)</text>

  <!-- ALB -->
  <rect x="520" y="425" width="150" height="55" rx="4" fill="#8C4FFF"/>
  <text x="595" y="447" text-anchor="middle" font-size="11" fill="#fff">ALB (HTTP :80)</text>
  <text x="595" y="463" text-anchor="middle" font-size="8" fill="#fff">reparte entre AZs</text>
  <line x1="985" y1="355" x2="640" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- AZ A -->
  <rect x="70" y="500" width="500" height="330" rx="6" fill="#f2fbff" stroke="#0073bb" stroke-dasharray="6 4"/>
  <text x="82" y="520" font-size="12" font-weight="bold" fill="#0073bb">Availability Zone A (us-east-1a)</text>
  <rect x="90" y="530" width="460" height="80" rx="4" fill="#e8f4f8" stroke="#6c8ebf"/>
  <text x="100" y="548" font-size="10">Subnet pública /24</text>
  <rect x="420" y="555" width="110" height="45" rx="4" fill="#8C4FFF"/>
  <text x="475" y="575" text-anchor="middle" font-size="9" fill="#fff">NAT GW</text>
  <text x="475" y="590" text-anchor="middle" font-size="8" fill="#fff">(prod: 1/AZ)</text>
  <rect x="90" y="625" width="460" height="185" rx="4" fill="#fff0e6" stroke="#d79b00"/>
  <text x="100" y="643" font-size="10">Subnet privada /24 (sin IP pública)</text>
  <rect x="140" y="660" width="120" height="55" rx="4" fill="#ED7100"/>
  <text x="200" y="682" text-anchor="middle" font-size="10" fill="#fff">Task nginx</text>
  <text x="200" y="698" text-anchor="middle" font-size="8" fill="#fff">:8080 no-root</text>
  <rect x="290" y="660" width="120" height="55" rx="4" fill="#ED7100"/>
  <text x="350" y="690" text-anchor="middle" font-size="10" fill="#fff">Task</text>
  <text x="100" y="795" font-size="9" font-style="italic" fill="#b85450">SG tareas: :8080 solo desde el SG del ALB</text>

  <!-- AZ B -->
  <rect x="600" y="500" width="500" height="330" rx="6" fill="#f2fbff" stroke="#0073bb" stroke-dasharray="6 4"/>
  <text x="612" y="520" font-size="12" font-weight="bold" fill="#0073bb">Availability Zone B (us-east-1b)</text>
  <rect x="620" y="530" width="460" height="80" rx="4" fill="#e8f4f8" stroke="#6c8ebf"/>
  <text x="630" y="548" font-size="10">Subnet pública /24</text>
  <rect x="950" y="555" width="110" height="45" rx="4" fill="#8C4FFF"/>
  <text x="1005" y="575" text-anchor="middle" font-size="9" fill="#fff">NAT GW</text>
  <text x="1005" y="590" text-anchor="middle" font-size="8" fill="#fff">(prod: 1/AZ)</text>
  <rect x="620" y="625" width="460" height="185" rx="4" fill="#fff0e6" stroke="#d79b00"/>
  <text x="630" y="643" font-size="10">Subnet privada /24 (sin IP pública)</text>
  <rect x="670" y="660" width="120" height="55" rx="4" fill="#ED7100"/>
  <text x="730" y="682" text-anchor="middle" font-size="10" fill="#fff">Task nginx</text>
  <text x="730" y="698" text-anchor="middle" font-size="8" fill="#fff">:8080 no-root</text>
  <rect x="820" y="660" width="120" height="55" rx="4" fill="#ED7100"/>
  <text x="880" y="690" text-anchor="middle" font-size="10" fill="#fff">Task</text>
  <text x="630" y="795" font-size="9" font-style="italic" fill="#b85450">SG tareas: :8080 solo desde el SG del ALB</text>

  <!-- ALB -> tasks -->
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="560" y1="480" x2="210" y2="660"/>
    <line x1="630" y1="480" x2="730" y2="660"/>
  </g>
  <!-- tasks -> NAT (dashed) -->
  <g stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrg)">
    <line x1="260" y1="675" x2="420" y2="585"/>
    <line x1="790" y1="675" x2="950" y2="585"/>
  </g>

  <text x="60" y="862" font-size="10" fill="#666">ECS Fargate + Application Auto Scaling (target tracking CPU/Mem) · tareas distribuidas en ambas AZ   |   — sólido: tráfico usuario   - - punteado: control/salida</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
